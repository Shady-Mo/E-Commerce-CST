<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist</title>

  <link href="../../shared/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="../../global.css" rel="stylesheet">

  <!-- page hero (same as products/cart) -->
  <link rel="stylesheet" href="../products/products.css">

  <!-- wishlist styles -->
  <link rel="stylesheet" href="./whishlist.css">
</head>

<body>

  <nav></nav>

  <section class="page-hero">
    <div class="container position-relative text-center">
      <h1 class="page-title mb-2">Wishlist</h1>

      <nav class="breadcrumb-wrap" aria-label="breadcrumb">
        <ol class="breadcrumb justify-content-center mb-0">
          <li class="breadcrumb-item"><a href="../home/home.html">Home</a></li>
          <li class="breadcrumb-item active" aria-current="page">Wishlist</li>
        </ol>
      </nav>
    </div>
  </section>

  <div class="container py-5 px-3 px-lg-5">

    <div class="table-responsive wishlist-table-wrap">
      <table class="table align-middle wishlist-table w-100">
        <thead>
          <tr>
            <th class="th-img">Image</th>
            <th class="th-product">Product</th>
            <th class="th-price">Price</th>
            <th class="th-status">Stock Status</th>
            <th class="th-add">Add to cart</th>
            <th class="th-remove">Remove</th>
          </tr>
        </thead>
        <tbody id="wishlistBody"></tbody>
      </table>
    </div>

  </div>

  <footer></footer>

  <!-- Delete Confirmation Modal -->
  <div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Remove Item</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body text-center">
          <i class="fa-solid fa-triangle-exclamation text-danger fs-1 mb-3"></i>
          <p>Are you sure you want to remove this item from your wishlist?</p>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Cancel
          </button>
          <button type="button" class="btn btn-danger" id="confirmDelete">
            Yes, Remove
          </button>
        </div>

      </div>
    </div>
  </div>

  <script src="../../shared/js/bootstrap/bootstrap.bundle.min.js"></script>
  <script type="module" src="./wishlist.js"></script>
</body>
</html>
