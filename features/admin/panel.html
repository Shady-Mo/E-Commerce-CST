<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel</title>

    <link href="../../shared/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="../../shared/fontawesome/css/all.min.css" rel="stylesheet" />
    <link href="../../global.css" rel="stylesheet" />
    <link href="admin.css" rel="stylesheet" />

    <script
      src="../../shared/js/bootstrap/bootstrap.bundle.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"
      defer
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="admin.js" defer></script>
  </head>

  <body>
    <!-- Admin Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="sidebar-header">
        <a href="panel.html">
          <img
            src="../../assets/images/logo-DXjmQiDB.svg"
            height="36"
            alt="Logo"
            class="sidebar-logo"
          />
        </a>
        <button class="btn btn-link sidebar-close d-lg-none" id="sidebarClose">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <nav class="sidebar-nav">
        <ul class="sidebar-menu">
          <li class="sidebar-menu-label">Main</li>
          <li>
            <a href="#" class="sidebar-link active" data-section="home">
              <i class="fas fa-chart-line"></i>
              <span>Dashboard</span>
            </a>
          </li>
          <li>
            <a href="#" class="sidebar-link" data-section="users">
              <i class="fas fa-users"></i>
              <span>Users</span>
            </a>
          </li>
          <li>
            <a href="#" class="sidebar-link" data-section="products">
              <i class="fas fa-boxes-stacked"></i>
              <span>Products</span>
            </a>
          </li>
          <li>
            <a href="#" class="sidebar-link" data-section="customer-service">
              <i class="fas fa-headset"></i>
              <span>Customer Service</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <button class="sidebar-link w-100 text-start" id="themeToggleBtn">
          <i class="fas fa-moon"></i>
          <span>Toggle Theme</span>
        </button>
        <button class="sidebar-link w-100 text-start" id="logoutBtn">
          <i class="fas fa-right-from-bracket"></i>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <!-- Sidebar Overlay for mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main Content -->
    <div class="admin-main" id="adminMain">
      <!-- Top bar for mobile -->
      <div class="admin-topbar d-lg-none">
        <button class="btn btn-link" id="sidebarToggle">
          <i class="fas fa-bars fs-5"></i>
        </button>
        <span class="fw-semibold">Admin Panel</span>
      </div>

      <div id="adminPanelContainer" class="main-section">
        <!-- Home / Dashboard Section -->
        <div class="admin-section active" id="section-home">
          <!-- Stats Cards -->
          <div class="row g-4 mb-4">
            <div class="col-sm-6 col-xl-3">
              <div class="stat-card">
                <div
                  class="stat-icon"
                  style="
                    background: rgba(187, 151, 109, 0.15);
                    color: var(--main-color);
                  "
                >
                  <i class="fas fa-shopping-cart"></i>
                </div>
                <div class="stat-info">
                  <span class="stat-value" id="statTotalOrders">0</span>
                  <span class="stat-label">Total Orders</span>
                </div>
              </div>
            </div>
            <div class="col-sm-6 col-xl-3">
              <div class="stat-card">
                <div
                  class="stat-icon"
                  style="background: rgba(25, 135, 84, 0.15); color: #198754"
                >
                  <i class="fas fa-coins"></i>
                </div>
                <div class="stat-info">
                  <span class="stat-value" id="statTotalRevenue">0</span>
                  <span class="stat-label">Total Revenue (EGP)</span>
                </div>
              </div>
            </div>
            <div class="col-sm-6 col-xl-3">
              <div class="stat-card">
                <div
                  class="stat-icon"
                  style="background: rgba(13, 110, 253, 0.15); color: #0d6efd"
                >
                  <i class="fas fa-users"></i>
                </div>
                <div class="stat-info">
                  <span class="stat-value" id="statTotalUsers">0</span>
                  <span class="stat-label">Total Users</span>
                </div>
              </div>
            </div>
            <div class="col-sm-6 col-xl-3">
              <div class="stat-card">
                <div
                  class="stat-icon"
                  style="background: rgba(220, 53, 69, 0.15); color: #dc3545"
                >
                  <i class="fas fa-box-open"></i>
                </div>
                <div class="stat-info">
                  <span class="stat-value" id="statTotalProducts">0</span>
                  <span class="stat-label">Total Products</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Charts -->
          <div class="row g-4 mb-4">
            <div class="col-12 col-lg-8">
              <div class="card shadow-sm">
                <div class="card-header">
                  <h5 class="mb-0">
                    <i class="fas fa-chart-area me-2"></i>Sales Rate
                  </h5>
                </div>
                <div class="card-body">
                  <div style="position: relative; height: 300px">
                    <canvas id="salesChart"></canvas>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-12 col-lg-4">
              <div class="card shadow-sm">
                <div class="card-header">
                  <h5 class="mb-0">
                    <i class="fas fa-chart-pie me-2"></i>Order Status
                  </h5>
                </div>
                <div class="card-body">
                  <canvas id="statusChart" height="300"></canvas>
                </div>
              </div>
            </div>
          </div>

          <div class="row g-4">
            <div class="col-12 col-lg-6">
              <div class="card shadow-sm">
                <div class="card-header">
                  <h5 class="mb-0">
                    <i class="fas fa-ranking-star me-2"></i>Top Selling Products
                  </h5>
                </div>
                <div class="card-body">
                  <canvas id="topProductsChart" height="280"></canvas>
                </div>
              </div>
            </div>
            <div class="col-12 col-lg-6">
              <div class="card shadow-sm">
                <div class="card-header">
                  <h5 class="mb-0">
                    <i class="fas fa-clock me-2"></i>Recent Orders
                  </h5>
                </div>
                <div class="card-body p-0">
                  <div id="recentOrdersList" class="recent-orders-list"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Users Section -->
        <div class="admin-section" id="section-users">
          <div class="row g-4">
            <div class="col-12 col-xl-7">
              <div class="card shadow-sm">
                <div class="card-header">
                  <h5 class="mb-0">
                    <i class="fas fa-users me-2"></i>All Users
                  </h5>
                </div>
                <div class="card-body">
                  <div class="row g-2 mb-3">
                    <div class="col-12 col-md-6 col-lg-8">
                      <div class="input-group">
                        <span class="input-group-text">
                          <i class="fas fa-search"></i>
                        </span>
                        <input
                          id="userSearch"
                          type="text"
                          class="form-control"
                          placeholder="Search users..."
                        />
                      </div>
                    </div>

                    <div class="col-6 col-md-3 col-lg-2">
                      <select
                        id="userRoleFilter"
                        class="form-select"
                        aria-label="Filter users by role"
                        title="Filter users by role"
                      >
                        <option value="all" selected>All</option>
                        <option value="admin">Admin</option>
                        <option value="seller">Seller</option>
                        <option value="customer">Customer</option>
                      </select>
                    </div>

                    <div class="col-6 col-md-3 col-lg-2">
                      <select
                        id="userPageSize"
                        class="form-select"
                        aria-label="Users per page"
                        title="Users per page"
                      >
                        <option value="5">5 per page</option>
                        <option value="10" selected>10 per page</option>
                        <option value="25">25 per page</option>
                      </select>
                    </div>
                  </div>
                  <div id="usersListContainer"></div>
                </div>
              </div>
            </div>
            <div class="col-12 col-xl-5">
              <div class="card shadow-sm">
                <div class="card-header">
                  <h5 class="mb-0">
                    <i class="fas fa-user-plus me-2"></i>Create New User
                  </h5>
                </div>
                <div class="card-body">
                  <form id="createUserForm" class="row g-3">
                    <div class="col-12">
                      <label for="adminUsername" class="form-label"
                        >Username</label
                      >
                      <input
                        type="text"
                        class="form-control"
                        id="adminUsername"
                      />
                      <div
                        id="adminUsernameError"
                        class="text-danger d-none"
                      ></div>
                    </div>
                    <div class="col-12">
                      <label for="adminEmail" class="form-label">Email</label>
                      <input
                        type="email"
                        class="form-control"
                        id="adminEmail"
                      />
                      <div
                        id="adminEmailError"
                        class="text-danger d-none"
                      ></div>
                    </div>
                    <div class="col-12">
                      <label for="adminPassword" class="form-label"
                        >Password</label
                      >
                      <input
                        type="password"
                        class="form-control"
                        id="adminPassword"
                      />
                      <div
                        id="adminPasswordError"
                        class="text-danger d-none"
                      ></div>
                    </div>
                    <div class="col-12">
                      <label for="adminConfirmPassword" class="form-label"
                        >Confirm Password</label
                      >
                      <input
                        type="password"
                        class="form-control"
                        id="adminConfirmPassword"
                      />
                      <div
                        id="adminConfirmPasswordError"
                        class="text-danger d-none"
                      ></div>
                    </div>
                    <div class="col-12">
                      <label for="adminRole" class="form-label">Role</label>
                      <select id="adminRole" class="form-select">
                        <option value="customer">Customer</option>
                        <option value="seller">Seller</option>
                        <option value="admin">Administrator</option>
                      </select>
                    </div>
                    <div class="col-12">
                      <button type="submit" class="btn btn-main w-100">
                        <i class="fas fa-plus-circle me-1"></i>Create User
                      </button>
                    </div>
                    <div
                      id="adminGeneralError"
                      class="text-danger d-none col-12"
                    ></div>
                    <div
                      id="adminSuccessMsg"
                      class="text-success d-none col-12"
                    ></div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Products Section -->
        <div class="admin-section" id="section-products">
          <div class="card shadow-sm">
            <div class="card-header">
              <h5 class="mb-0">
                <i class="fas fa-boxes me-2"></i>Product Listings
              </h5>
            </div>
            <div class="card-body">
              <div class="row g-2 mb-3">
                <div class="col-sm-7 col-md-8">
                  <div class="input-group">
                    <span class="input-group-text"
                      ><i class="fas fa-search"></i
                    ></span>
                    <input
                      id="productSearch"
                      type="text"
                      class="form-control"
                      placeholder="Search products by name or ID..."
                    />
                  </div>
                </div>
                <div class="col-sm-5 col-md-4">
                  <select id="productPageSize" class="form-select">
                    <option value="5">5 per page</option>
                    <option value="10" selected>10 per page</option>
                    <option value="25">25 per page</option>
                  </select>
                </div>
              </div>
              <div id="productsListContainer"></div>
            </div>
          </div>
        </div>

        <!-- Customer Service Section -->
        <div class="admin-section" id="section-customer-service">
          <div class="card shadow-sm">
            <div class="card-header">
              <h5 class="mb-0">
                <i class="fas fa-headset me-2"></i>Customer Service / Orders
              </h5>
            </div>
            <div class="card-body">
              <!-- Filtration UI -->
              <div class="row mb-4 g-3 align-items-end">
                <div class="col-md-4">
                  <label for="csStatusFilter" class="form-label">Status:</label>
                  <select id="csStatusFilter" class="form-select" title="Filter by order status" aria-label="Filter by order status">
                    <option value="all">All Orders</option>
                    <option value="pending">Pending</option>
                    <option value="received">Received</option>
                    <option value="cancelled">Cancelled</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label for="csSearchInput" class="form-label">Search:</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-search"></i></span>
                    <input type="text" class="form-control" id="csSearchInput" placeholder="Search by Order ID or customer name..." />
                  </div>
                </div>
                <div class="col-md-2">
                  <button id="csClearFiltersBtn" class="btn btn-secondary w-100" title="Clear all filters" aria-label="Clear all filters">
                    <i class="fas fa-redo me-1"></i>Clear
                  </button>
                </div>
              </div>
              <div id="csListContainer"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="editUserModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Edit User</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form id="editUserForm">
              <input type="hidden" id="editUserId" />
              <div class="mb-3">
                <label class="form-label">Username</label>
                <input id="editUsername" class="form-control" />
                <div id="editUsernameError" class="text-danger d-none"></div>
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input id="editEmail" class="form-control" />
                <div id="editEmailError" class="text-danger d-none"></div>
              </div>
              <div class="mb-3">
                <label class="form-label">Role</label>
                <select id="editRole" class="form-select">
                  <option value="customer">Customer</option>
                  <option value="seller">Seller</option>
                  <option value="admin">Administrator</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label"
                  >New Password (leave blank to keep)</label
                >
                <input id="editPassword" type="password" class="form-control" />
                <div id="editPasswordError" class="text-danger d-none"></div>
              </div>
            </form>
            <div id="editGeneralError" class="text-danger d-none"></div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button id="saveEditUserBtn" type="button" class="btn btn-main">
              Save changes
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="confirmModalTitle">Confirm</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body" id="confirmModalBody"></div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="button" class="btn btn-main" id="confirmModalBtn">
              OK
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
