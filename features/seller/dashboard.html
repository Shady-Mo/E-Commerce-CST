<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seller Dashboard</title>
    <link rel="stylesheet" href="../../shared/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="../../shared/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="../../global.css" />
    <link rel="stylesheet" href="./seller.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <nav></nav>
    <section class="bg-gradient py-4">
      <div class="container position-relative">
        <nav class="breadcrumb-wrap" aria-label="breadcrumb">
          <ol class="breadcrumb justify-content-center mb-0">
            <li class="breadcrumb-item">
              <a href="../home/home.html">Home</a>
            </li>
            <li class="breadcrumb-item active" aria-current="page">
              Dashboard
            </li>
          </ol>
        </nav>
      </div>
    </section>

    <main class="container my-2">
      <div class="row mb-3">
        <div class="col-12">
          <h2 class="page-title mb-1">
            Welcome, <span id="sellerName"></span>
          </h2>
          <p class="text-muted mb-0">
            Here's an overview of your store performance
          </p>
        </div>
      </div>

      <div class="row mb-3 g-3">
        <div class="col-md-3">
          <div class="card stat-card shadow-sm">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center">
                <div>
                  <h6 class="text-muted mb-2">Total Products</h6>
                  <h3 class="mb-0" id="totalProducts">0</h3>
                </div>
                <div>
                  <i class="fas fa-box"></i>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card stat-card shadow-sm">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center">
                <div>
                  <h6 class="text-muted mb-2">Total Orders</h6>
                  <h3 class="mb-0" id="totalOrders">0</h3>
                </div>
                <div>
                  <i class="fas fa-shopping-cart"></i>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card stat-card shadow-sm">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center">
                <div>
                  <h6 class="text-muted mb-2">Total Sales</h6>
                  <h3 class="mb-0" id="totalSales">$0</h3>
                </div>
                <div>
                  <i class="fas fa-dollar-sign"></i>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card stat-card shadow-sm">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center">
                <div>
                  <h6 class="text-muted mb-2">Low Stock Items</h6>
                  <h3 class="mb-0" id="lowStock">0</h3>
                </div>
                <div>
                  <i class="fas fa-exclamation-triangle"></i>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-12">
          <div class="card shadow-sm">
            <div class="card-body">
              <div class="d-flex gap-3 flex-wrap">
                <a href="add-product.html" class="btn btn-main">
                  <i class="fas fa-plus me-2"></i>Add New Product
                </a>
                <a
                  href="manage-products.html"
                  class="btn btn-outline-primary d-inline-flex align-items-center"
                >
                  <i class="fas fa-boxes me-2"></i>
                  Manage Products
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="row mb-4 g-3">
        <div class="col-lg-8">
          <div class="card shadow-sm">
            <div class="card-header bg-gradient">
              <h5 class="mb-0">
                <i class="fas fa-chart-line me-2"></i>Sales Analytics
              </h5>
            </div>
            <div class="card-body">
              <canvas id="salesChart"></canvas>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="card shadow-sm">
            <div class="card-header bg-gradient">
              <h5 class="mb-0">
                <i class="fas fa-chart-pie me-2"></i>Product Status
              </h5>
            </div>
            <div class="card-body">
              <canvas id="productStatusChart"></canvas>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="../../shared/js/bootstrap/bootstrap.bundle.min.js"></script>
    <script type="module" src="./dashboard.js"></script>
  </body>
</html>
