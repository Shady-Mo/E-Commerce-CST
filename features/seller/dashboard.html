<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seller Dashboard</title>
    <link rel="stylesheet" href="../../shared/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="../../shared/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="../../global.css" />
    <link rel="stylesheet" href="./seller.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    <aside class="seller-sidebar" id="sellerSidebar">
      <div class="sidebar-header">
        <a href="dashboard.html">
          <img
            src="../../assets/images/logo-DXjmQiDB.svg"
            height="36"
            alt="Logo"
            class="sidebar-logo"
          />
        </a>
        <button
          class="btn btn-link sidebar-close d-lg-none"
          id="sidebarClose"
          type="button"
          title="Close sidebar"
          aria-label="Close sidebar"
        >
          <i class="fas fa-times"></i>
        </button>
      </div>

      <nav class="sidebar-nav">
        <ul class="sidebar-menu">
          <li class="sidebar-menu-label">Main</li>
          <li>
            <a href="dashboard.html" class="sidebar-link active">
              <i class="fas fa-chart-line"></i>
              <span>Dashboard</span>
            </a>
          </li>
          <li>
            <a href="manage-products.html" class="sidebar-link">
              <i class="fas fa-boxes-stacked"></i>
              <span>Manage Products</span>
            </a>
          </li>
          <li>
            <a href="add-product.html" class="sidebar-link">
              <i class="fas fa-plus-circle"></i>
              <span>Add Product</span>
            </a>
          </li>
          <li>
            <a href="orders.html" class="sidebar-link">
              <i class="fas fa-shopping-cart"></i>
              <span>Orders</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <button
          class="sidebar-link w-100 text-start"
          id="themeToggleBtn"
          type="button"
          title="Toggle theme"
        >
          <i class="fas fa-moon"></i>
          <span>Toggle Theme</span>
        </button>
        <button
          class="sidebar-link w-100 text-start"
          id="logoutBtn"
          type="button"
          title="Logout"
        >
          <i class="fas fa-right-from-bracket"></i>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="seller-main" id="sellerMain">
      <div class="seller-topbar d-lg-none">
        <button
          class="btn btn-link"
          id="sidebarToggle"
          type="button"
          title="Open sidebar"
          aria-label="Open sidebar"
        >
          <i class="fas fa-bars fs-5"></i>
        </button>
        <span class="fw-semibold">Seller Dashboard</span>
      </div>

      <div id="sellerPanelContainer" class="main-section">
        <div class="seller-section active" id="section-dashboard">
          <div class="row mb-3">
            <div class="col-12">
              <h2 class="page-title mb-1">
                Welcome, <span id="sellerName"></span>
              </h2>
              <p class="text-muted mb-0">
                Here's an overview of your store performance
              </p>
            </div>
          </div>

          <div class="row mb-3 g-3">
            <div class="col-sm-6 col-xl-3">
              <div class="stat-card">
                <div class="stat-icon stat-icon-products">
                  <i class="fas fa-box"></i>
                </div>
                <div class="stat-info">
                  <span class="stat-value" id="totalProducts">0</span>
                  <span class="stat-label">Total Products</span>
                </div>
              </div>
            </div>
            <div class="col-sm-6 col-xl-3">
              <div class="stat-card">
                <div class="stat-icon stat-icon-orders">
                  <i class="fas fa-shopping-cart"></i>
                </div>
                <div class="stat-info">
                  <span class="stat-value" id="totalOrders">0</span>
                  <span class="stat-label">Total Orders</span>
                </div>
              </div>
            </div>
            <div class="col-sm-6 col-xl-3">
              <div class="stat-card">
                <div class="stat-icon stat-icon-sales">
                  <i class="fas fa-dollar-sign"></i>
                </div>
                <div class="stat-info">
                  <span class="stat-value" id="totalSales">$0</span>
                  <span class="stat-label">Total Sales</span>
                </div>
              </div>
            </div>
            <div class="col-sm-6 col-xl-3">
              <div class="stat-card">
                <div class="stat-icon stat-icon-stock">
                  <i class="fas fa-exclamation-triangle"></i>
                </div>
                <div class="stat-info">
                  <span class="stat-value" id="lowStock">0</span>
                  <span class="stat-label">Low Stock Items</span>
                </div>
              </div>
            </div>
          </div>

          <div class="row mb-4 g-3">
            <div class="col-12">
              <h5 class="fw-semibold text-muted mb-0">
                <i class="fas fa-bolt me-2"></i>Quick Actions
              </h5>
            </div>
            <div class="col-sm-6 col-md-4">
              <a
                href="manage-products.html"
                class="btn btn-outline-primary w-100 py-3"
              >
                <i class="fas fa-boxes-stacked d-block fs-4 mb-1"></i>
                Manage Products
              </a>
            </div>
            <div class="col-sm-6 col-md-4">
              <a href="add-product.html" class="btn btn-main w-100 py-3">
                <i class="fas fa-plus-circle d-block fs-4 mb-1"></i>
                Add Product
              </a>
            </div>
            <div class="col-sm-6 col-md-4">
              <a href="orders.html" class="btn btn-outline-primary w-100 py-3">
                <i class="fas fa-shopping-cart d-block fs-4 mb-1"></i>
                View Orders
              </a>
            </div>
          </div>

          <div class="row mb-4 g-3">
            <div class="col-lg-8">
              <div class="card shadow-sm">
                <div class="card-header">
                  <h5 class="mb-0">
                    <i class="fas fa-chart-line me-2"></i>Sales Analytics
                  </h5>
                </div>
                <div class="card-body">
                  <canvas id="salesChart"></canvas>
                </div>
              </div>
            </div>
            <div class="col-lg-4">
              <div class="card shadow-sm">
                <div class="card-header">
                  <h5 class="mb-0">
                    <i class="fas fa-chart-pie me-2"></i>Product Status
                  </h5>
                </div>
                <div class="card-body">
                  <canvas id="productStatusChart"></canvas>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="../../shared/js/bootstrap/bootstrap.bundle.min.js"></script>
    <script type="module" src="./dashboard.js"></script>
  </body>
</html>
