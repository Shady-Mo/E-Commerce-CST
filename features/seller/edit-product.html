<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Product</title>
    <link rel="stylesheet" href="../../shared/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="../../shared/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="../../global.css" />
    <link rel="stylesheet" href="./seller.css" />
  </head>
  <body>
    <aside class="seller-sidebar" id="sellerSidebar">
      <div class="sidebar-header">
        <a href="dashboard.html">
          <img
            src="../../assets/images/logo-DXjmQiDB.svg"
            height="36"
            alt="Logo"
            class="sidebar-logo"
          />
        </a>
        <button class="btn btn-link sidebar-close d-lg-none" id="sidebarClose" type="button" title="Close sidebar" aria-label="Close sidebar">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <nav class="sidebar-nav">
        <ul class="sidebar-menu">
          <li class="sidebar-menu-label">Main</li>
          <li>
            <a href="dashboard.html" class="sidebar-link">
              <i class="fas fa-chart-line"></i>
              <span>Dashboard</span>
            </a>
          </li>
          <li>
            <a href="manage-products.html" class="sidebar-link active">
              <i class="fas fa-boxes-stacked"></i>
              <span>Manage Products</span>
            </a>
          </li>
          <li>
            <a href="add-product.html" class="sidebar-link">
              <i class="fas fa-plus-circle"></i>
              <span>Add Product</span>
            </a>
          </li>
          <li>
            <a href="orders.html" class="sidebar-link">
              <i class="fas fa-shopping-cart"></i>
              <span>Orders</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <button class="sidebar-link w-100 text-start" id="themeToggleBtn" type="button" title="Toggle theme">
          <i class="fas fa-moon"></i>
          <span>Toggle Theme</span>
        </button>
        <button class="sidebar-link w-100 text-start" id="logoutBtn" type="button" title="Logout">
          <i class="fas fa-right-from-bracket"></i>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="seller-main" id="sellerMain">
      <div class="seller-topbar d-lg-none">
        <button class="btn btn-link" id="sidebarToggle" type="button" title="Open sidebar" aria-label="Open sidebar">
          <i class="fas fa-bars fs-5"></i>
        </button>
        <span class="fw-semibold">Edit Product</span>
      </div>

      <div id="sellerPanelContainer" class="main-section">
        <div class="row mb-3">
          <div class="col-12 d-flex justify-content-between align-items-center">
            <h2 class="page-title">Edit Product</h2>
            <a href="manage-products.html" class="btn btn-outline-secondary">
              <i class="fas fa-arrow-left me-2"></i>Back to Products
            </a>
          </div>
        </div>

        <div class="card shadow-sm">
          <div class="card-header">
            <h5 class="mb-0"><i class="fas fa-edit me-2"></i>Edit Product</h5>
          </div>
        <div class="card-body">
          <form id="productForm">
            <input type="hidden" id="productId" />

            <div class="row">
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="productName" class="form-label"
                    >Product Name *</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="productName"
                    required
                  />
                  <div class="invalid-feedback" id="nameError"></div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="productPrice" class="form-label"
                      >Price ($) *</label
                    >
                    <input
                      type="number"
                      class="form-control"
                      id="productPrice"
                      step="0.01"
                      min="0"
                      required
                    />
                    <div class="invalid-feedback" id="priceError"></div>
                  </div>

                  <div class="col-md-6 mb-3">
                    <label for="productOldPrice" class="form-label"
                      >Old Price (Optional)</label
                    >
                    <input
                      type="number"
                      class="form-control"
                      id="productOldPrice"
                      step="0.01"
                      min="0"
                    />
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="productStock" class="form-label"
                      >Stock Quantity *</label
                    >
                    <input
                      type="number"
                      class="form-control"
                      id="productStock"
                      min="0"
                      required
                    />
                    <div class="invalid-feedback" id="stockError"></div>
                  </div>

                  <div class="col-md-6 mb-3">
                    <label for="productDiscount" class="form-label"
                      >Discount %</label
                    >
                    <input
                      type="number"
                      class="form-control"
                      id="productDiscount"
                      min="0"
                      max="100"
                      value="0"
                    />
                  </div>
                </div>

                <div class="mb-3">
                  <label for="productCategory" class="form-label"
                    >Category *</label
                  >
                  <select class="form-select" id="productCategory" required>
                    <option value="">Select a category</option>
                    <option value="Furniture">Furniture</option>
                    <option value="Lighting">Lighting</option>
                    <option value="Decor">Decor</option>
                    <option value="Accessories">Accessories</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label for="productBadge" class="form-label"
                    >Badge (Optional)</label
                  >
                  <select class="form-select" id="productBadge">
                    <option value="">None</option>
                    <option value="New">New</option>
                    <option value="Hot">Hot</option>
                    <option value="Sale">Sale</option>
                  </select>
                </div>
              </div>

              <div class="col-md-6">
                <div class="mb-3">
                  <label for="productImage" class="form-label"
                    >Main Image</label
                  >
                  <input
                    type="file"
                    class="form-control"
                    id="productImage"
                    accept="image/*"
                  />
                  <small class="text-muted"
                    >Leave empty to keep existing image</small
                  >
                  <div class="invalid-feedback" id="imageError"></div>
                  <div
                    class="mt-3 image-preview-container show"
                    id="imagePreviewContainer"
                  >
                    <img
                      id="imagePreview"
                      src=""
                      alt="Preview"
                      class="preview-image"
                    />
                  </div>
                </div>

                <div class="mb-3">
                  <label for="productImages" class="form-label"
                    >Additional Images (Optional)</label
                  >
                  <input
                    type="file"
                    class="form-control"
                    id="productImages"
                    accept="image/*"
                    multiple
                  />
                  <small class="text-muted">Leave empty to keep existing images</small>

                  <div class="mt-3 d-flex flex-wrap gap-2" id="additionalImagesPreview"></div>
                </div>

                <div class="mb-3">
                  <label for="productDescription" class="form-label"
                    >Description</label
                  >
                  <textarea
                    class="form-control"
                    id="productDescription"
                    rows="2"
                    placeholder="Enter product description"
                  ></textarea>
                </div>
              </div>
            </div>

            <div class="alert alert-danger d-none" id="formErrorAlert"></div>

            <div class="d-flex gap-3 justify-content-end">
              <a
                href="manage-products.html"
                class="btn btn-secondary d-inline-flex align-items-center"
              >
                <i class="fas fa-times me-2"></i>
                Cancel
              </a>
              <button type="submit" class="btn btn-main">
                <i class="fas fa-save me-2"></i>Update Product
              </button>
            </div>
          </form>
        </div>
      </div>
      </div>
    </div>
    <script src="../../shared/js/bootstrap/bootstrap.bundle.min.js"></script>
    <script type="module" src="./edit-product.js"></script>
  </body>
</html>
