<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Product</title>
    <link rel="stylesheet" href="../../shared/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="../../shared/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="../../global.css" />
    <link rel="stylesheet" href="./seller.css" />
  </head>
  <body>
    <section class="bg-gradient py-4">
      <div class="container position-relative">
        <nav class="breadcrumb-wrap" aria-label="breadcrumb">
          <ol class="breadcrumb justify-content-center mb-0">
            <li class="breadcrumb-item">
              <a href="../home/home.html">Home</a>
            </li>
            <li class="breadcrumb-item">
              <a href="./dashboard.html">Dashboard</a>
            </li>
            <li class="breadcrumb-item">
              <a href="./manage-products.html">Manage Products</a>
            </li>
            <li class="breadcrumb-item active" aria-current="page">
              Edit Product
            </li>
          </ol>
        </nav>
      </div>
    </section>

    <main class="container my-2">
      <div class="card shadow-sm">
        <div class="card-header bg-gradient">
          <h5 class="mb-0"><i class="fas fa-edit me-2"></i>Edit Product</h5>
        </div>
        <div class="card-body">
          <form id="productForm">
            <input type="hidden" id="productId" />

            <div class="row">
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="productName" class="form-label"
                    >Product Name *</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="productName"
                    required
                  />
                  <div class="invalid-feedback" id="nameError"></div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="productPrice" class="form-label"
                      >Price ($) *</label
                    >
                    <input
                      type="number"
                      class="form-control"
                      id="productPrice"
                      step="0.01"
                      min="0"
                      required
                    />
                    <div class="invalid-feedback" id="priceError"></div>
                  </div>

                  <div class="col-md-6 mb-3">
                    <label for="productOldPrice" class="form-label"
                      >Old Price (Optional)</label
                    >
                    <input
                      type="number"
                      class="form-control"
                      id="productOldPrice"
                      step="0.01"
                      min="0"
                    />
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="productStock" class="form-label"
                      >Stock Quantity *</label
                    >
                    <input
                      type="number"
                      class="form-control"
                      id="productStock"
                      min="0"
                      required
                    />
                    <div class="invalid-feedback" id="stockError"></div>
                  </div>

                  <div class="col-md-6 mb-3">
                    <label for="productDiscount" class="form-label"
                      >Discount %</label
                    >
                    <input
                      type="number"
                      class="form-control"
                      id="productDiscount"
                      min="0"
                      max="100"
                      value="0"
                    />
                  </div>
                </div>

                <div class="mb-3">
                  <label for="productBadge" class="form-label"
                    >Badge (Optional)</label
                  >
                  <select class="form-select" id="productBadge">
                    <option value="">None</option>
                    <option value="New">New</option>
                    <option value="Hot">Hot</option>
                    <option value="Sale">Sale</option>
                  </select>
                </div>
              </div>

              <div class="col-md-6">
                <div class="mb-3">
                  <label for="productImage" class="form-label"
                    >Main Image</label
                  >
                  <input
                    type="file"
                    class="form-control"
                    id="productImage"
                    accept="image/*"
                  />
                  <small class="text-muted"
                    >Leave empty to keep existing image</small
                  >
                  <div class="invalid-feedback" id="imageError"></div>
                  <div
                    class="mt-3 image-preview-container show"
                    id="imagePreviewContainer"
                  >
                    <img
                      id="imagePreview"
                      src=""
                      alt="Preview"
                      class="preview-image"
                    />
                  </div>
                </div>

                <div class="mb-3">
                  <label for="productDescription" class="form-label"
                    >Description</label
                  >
                  <textarea
                    class="form-control"
                    id="productDescription"
                    rows="2"
                    placeholder="Enter product description"
                  ></textarea>
                </div>
              </div>
            </div>

            <div class="alert alert-danger d-none" id="formErrorAlert"></div>

            <div class="d-flex gap-3 justify-content-end">
              <a
                href="manage-products.html"
                class="btn btn-secondary d-inline-flex align-items-center"
              >
                <i class="fas fa-times me-2"></i>
                Cancel
              </a>
              <button type="submit" class="btn btn-main">
                <i class="fas fa-save me-2"></i>Update Product
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <script src="../../shared/js/bootstrap/bootstrap.bundle.min.js"></script>
    <script type="module" src="./edit-product.js"></script>
  </body>
</html>
