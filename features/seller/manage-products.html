<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Products</title>
    <link rel="stylesheet" href="../../shared/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="../../shared/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="../../global.css" />
    <link rel="stylesheet" href="./seller.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    <aside class="seller-sidebar" id="sellerSidebar">
      <div class="sidebar-header">
        <a href="dashboard.html">
          <img
            src="../../assets/images/logo-DXjmQiDB.svg"
            height="36"
            alt="Logo"
            class="sidebar-logo"
          />
        </a>
        <button class="btn btn-link sidebar-close d-lg-none" id="sidebarClose">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <nav class="sidebar-nav">
        <ul class="sidebar-menu">
          <li class="sidebar-menu-label">Main</li>
          <li>
            <a href="dashboard.html" class="sidebar-link">
              <i class="fas fa-chart-line"></i>
              <span>Dashboard</span>
            </a>
          </li>
          <li>
            <a href="manage-products.html" class="sidebar-link active">
              <i class="fas fa-boxes-stacked"></i>
              <span>Manage Products</span>
            </a>
          </li>
          <li>
            <a href="add-product.html" class="sidebar-link">
              <i class="fas fa-plus-circle"></i>
              <span>Add Product</span>
            </a>
          </li>
          <li>
            <a href="orders.html" class="sidebar-link">
              <i class="fas fa-shopping-cart"></i>
              <span>Orders</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <button class="sidebar-link w-100 text-start" id="themeToggleBtn">
          <i class="fas fa-moon"></i>
          <span>Toggle Theme</span>
        </button>
        <button class="sidebar-link w-100 text-start" id="logoutBtn">
          <i class="fas fa-right-from-bracket"></i>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="seller-main" id="sellerMain">
      <div class="seller-topbar d-lg-none">
        <button class="btn btn-link" id="sidebarToggle">
          <i class="fas fa-bars fs-5"></i>
        </button>
        <span class="fw-semibold">Manage Products</span>
      </div>

      <div id="sellerPanelContainer" class="main-section">
        <div class="row mb-4">
          <div class="col-12 d-flex justify-content-between align-items-center">
            <h2 class="page-title">Manage Products</h2>
            <a href="add-product.html" class="btn btn-main">
              <i class="fas fa-plus me-2"></i>Add New Product
            </a>
          </div>
        </div>

        <div class="row">
          <div class="col-12">
            <div class="card shadow-sm">
              <div class="card-header">
                <h5 class="mb-0">
                  <i class="fas fa-boxes me-2"></i>My Products
                </h5>
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table class="table table-hover align-middle">
                    <thead>
                      <tr>
                        <th>Image</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Created</th>
                        <th>Actions</th>
                      </tr>
                    </thead>
                    <tbody id="productsTableBody"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="../../shared/js/bootstrap/bootstrap.bundle.min.js"></script>
    <script type="module" src="./manage-products.js"></script>
  </body>
</html>
