<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Shopping Cart</title>

  <link href="../../shared/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="../../global.css" rel="stylesheet">
  <link rel="stylesheet" href="../products/products.css">
  <link rel="stylesheet" href="./cart.css">
</head>

<body>

  <nav></nav>
  <section class="page-hero">
  <div class="container position-relative text-center">
    <h1 class="page-title mb-2">Shopping Cart</h1>

    <nav class="breadcrumb-wrap" aria-label="breadcrumb">
      <ol class="breadcrumb justify-content-center mb-0">
        <li class="breadcrumb-item"><a href="../home/home.html">Home</a></li>
        <li class="breadcrumb-item active" aria-current="page">Shopping Cart</li>
      </ol>
    </nav>
  </div>
</section>
  <div class="container py-5 px-3 px-lg-5">

  <!-- TABLE (full width) -->
  <div class="table-responsive cart-table-wrap">
    <table class="table align-middle cart-table w-100">
      <thead>
        <tr>
          <th class="th-img" data-label="Image">Image</th>
          <th class="th-product" data-label="Product">Product</th>
          <th class="th-price" data-label="Price">Price</th>
          <th class="th-qty" data-label="Quantity">Quantity</th>
          <th class="th-total" data-label="Total">Total</th>
          <th class="th-remove" data-label="Remove">Remove</th>
        </tr>
      </thead>
      <tbody id="cartBody"></tbody>
    </table>
  </div>

  <!-- SUMMARY (below table) -->
  <div class="cart-summary-wrap mt-5">
    <div class="cart-summary">
      <h4 class="summary-title">Cart Summary</h4>

      <div class="summary-row">
        <span>Sub Total</span>
        <span id="subTotal">0 EGP</span>
      </div>

      <div class="summary-row">
        <span>Shipping Cost</span>
        <span id="shippingCost">0 EGP</span>
      </div>

      <hr class="summary-hr">

      <div class="summary-row summary-grand">
        <span>Grand Total</span>
        <span><span id="grandTotal">0</span> EGP</span>
      </div>

      <div class="summary-actions">
        <button class="btn btn-outline-main" id="updateCartBtn" type="button">Update Cart</button>
        <button class="btn btn-main" id="checkoutBtn" type="button">Checkout</button>
      </div>
    </div>
  </div>

</div>
  <footer></footer>

  <!-- Delete Confirmation Modal -->
  <div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Remove Item</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body text-center">
          <i class="fa-solid fa-triangle-exclamation text-danger fs-1 mb-3"></i>
          <p>Are you sure you want to remove this item from your cart?</p>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Cancel
          </button>
          <button type="button" class="btn btn-danger" id="confirmDelete">
            Yes, Remove
          </button>
        </div>

      </div>
    </div>
  </div>


  <script src="../../shared/js/bootstrap/bootstrap.bundle.min.js"></script>
  <script type="module" src="./cart.js"></script>

</body>

</html>
