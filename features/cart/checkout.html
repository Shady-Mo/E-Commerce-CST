<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>

    <link href="../../shared/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="../../global.css" rel="stylesheet">
  <link rel="stylesheet" href="../products/products.css">
  <link rel="stylesheet" href="./checkout.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <nav></nav>
      <section class="page-hero">
  <div class="container position-relative text-center">
    <h1 class="page-title mb-2">Checkout</h1>

    <nav class="breadcrumb-wrap" aria-label="breadcrumb">
      <ol class="breadcrumb justify-content-center mb-0">
        <li class="breadcrumb-item"><a href="../home/home.html">Home</a></li>
        <li class="breadcrumb-item active" aria-current="page">checkout</li>
      </ol>
    </nav>
  </div>
</section>
     <section class="checkout-section container py-5">

<div class="row">

<!-- Billing Address -->
<div class="col-lg-7">

<h4 class="mb-4">Billing Address</h4>

<form id="checkoutForm">

<div class="row">

<div class="col-md-6 mb-3">
<label>First Name *</label>
<input type="text" class="form-control" id="firstName" placeholder="First Name">
</div>

<div class="col-md-6 mb-3">
<label>Last Name *</label>
<input type="text" class="form-control" id="lastName" placeholder="Last Name">
</div>

<div class="col-md-6 mb-3">
<label>Email Address *</label>
<input type="email" class="form-control" id="email" placeholder="Email Address">
</div>

<div class="col-md-6 mb-3">
<label>Phone No *</label>
<input type="text" class="form-control" id="phone" placeholder="Phone number">
</div>

<div class="col-12 mb-3">
<label>Company Name</label>
<input type="text" class="form-control" placeholder="Company Name">
</div>

<div class="col-12 mb-3">
<label>Address *</label>
<input type="text" class="form-control" id="address1" placeholder="Address line 1">
</div>

<div class="col-12 mb-3">
<input type="text" class="form-control" placeholder="Address line 2">
</div>

<div class="col-md-6 mb-3">
<label>Country *</label>
<select class="form-control" id="country">
<option>Egypt</option>
<option>Saudi Arabia</option>
<option>UAE</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label>Town/City *</label>
<input type="text" class="form-control" id="city" placeholder="Town/City">
</div>

<div class="col-md-6 mb-3">
<label>State *</label>
<input type="text" class="form-control" id="state" placeholder="State">
</div>

<div class="col-md-6 mb-3">
<label>Zip Code *</label>
<input type="text" class="form-control" id="zip" placeholder="Zip Code">
</div>

</div>

</form>

</div>

<!-- Cart Total -->
<div class="col-lg-5">

<div class="cart-summary">

<h4 class="mb-4">Cart Total</h4>

<div class="cart-items" id="checkoutItems"></div>

<hr>

<div class="d-flex justify-content-between">
<span>Sub Total</span>
<span id="subTotal">$0</span>
</div>

<hr>

<div class="d-flex justify-content-between">
<span>Shipping Fee</span>
<span id="shipping">$0</span>
</div>

<hr>

<div class="d-flex justify-content-between fw-bold fs-5">
<span>Grand Total</span>
<span id="grandTotal">$0</span>
</div>

<hr>

<h5 class="mt-4">Payment Method</h5>

<div class="payment-method">

<div class="form-check">
<input type="radio" name="payment" value="bank" class="form-check-input">
<label class="form-check-label">Direct Bank Transfer</label>
</div>

<div class="form-check">
<input type="radio" name="payment" value="cod" class="form-check-input">
<label class="form-check-label">Cash On Delivery</label>
</div>

<div class="form-check">
<input type="radio" name="payment" value="paypal" class="form-check-input">
<label class="form-check-label">Paypal</label>
</div>

</div>

<button id="placeOrderBtn" class="btn btn-main w-100 mt-4">
Place Order
</button>

</div>

</div>

</div>

</section>

    <footer></footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./checkout.js"></script>

</body>

</html>
