<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>

    <link href="../../../shared/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="../../../global.css" rel="stylesheet">
  <link rel="stylesheet" href="../../products/products.css">
  <link rel="stylesheet" href="../../auth/auth.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <nav></nav>
      <section class="page-hero">
  <div class="container position-relative text-center ">
    

    <nav class="breadcrumb-wrap" aria-label="breadcrumb">
      <ol class="breadcrumb justify-content-center mb-0">
        <li class="breadcrumb-item"><a href="../../home/home.html">Home</a></li>
        <li class="breadcrumb-item active" aria-current="page">MY Profile</li>
      </ol>
    </nav>
  </div>
</section>
 
<main class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-5 col-md-7 col-12 ">

<form id="profileForm" class="auth-form d-flex flex-column gap-3">



<!-- USERNAME -->

<div class="w-100 mt-3">

<label class="form-label">Username</label>

<div class="input-group custom-input">

<span class="input-group-text">
<i class="fa-regular fa-user"></i>
</span>

<input
type="text"
class="form-control"
id="profileUsername"
placeholder="Enter username"
/>

</div>

</div>


<!-- EMAIL -->

<div class="w-100">

<label class="form-label">Email</label>

<div class="input-group custom-input">

<span class="input-group-text">
<i class="fa-regular fa-envelope"></i>
</span>

<input
type="email"
class="form-control"
id="profileEmail"
placeholder="Enter email"
/>

</div>

</div>


<!-- PASSWORD -->

<div class="w-100">

<label class="form-label">New Password</label>

<div class="input-group custom-input">

<span class="input-group-text">
<i class="fa-solid fa-lock"></i>
</span>

<input
type="password"
class="form-control"
id="profilePassword"
placeholder="Leave empty if you don't want to change"
/>

<button
class="input-group-text password-toggle"
type="button"
id="toggleProfilePassword"
>
<i class="fa-regular fa-eye"></i>
</button>

</div>

</div>


<!-- CONFIRM PASSWORD -->

<div class="w-100">

<label class="form-label">Confirm Password</label>

<div class="input-group custom-input">

<span class="input-group-text">
<i class="fa-solid fa-lock"></i>
</span>

<input
type="password"
class="form-control"
id="profileConfirmPassword"
placeholder="Confirm password"
/>

</div>

</div>


<button class="btn btn-main w-100 mt-2">
Update Profile
</button>

</form>

</div>

</div>

</main>

    <footer></footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="./profile.js"></script>

</body>

</html>
