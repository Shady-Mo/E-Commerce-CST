<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <link rel="stylesheet" href="../../shared/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="../../shared/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="../../global.css" />
    <link rel="stylesheet" href="auth.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>

  <body>
    <nav></nav>

    <main class="main-section container-fluid mt-3">
      <div class="row align-items-center h-100">

        <section class="col-md-6 col-12 d-none d-md-block">
          <div class="img-wrapper">
            <img src="../../assets/images/login-image.jpg" alt="" />
          </div>
        </section>

        <section
          class="col-md-6 col-12 d-flex flex-column align-items-center justify-content-center"
        >
           <form id="loginForm" class="auth-form needs-validation" novalidate>

<h2 class="mb-2 text-center">Welcome Back!</h2>

<p class="text-center text-muted mb-4">
Buy & sell your exclusive product only on Furnixar
</p>


<!-- EMAIL / USERNAME -->

<div class="mb-3">

<label class="form-label">Email or Username</label>

<div class="input-group custom-input">

<span class="input-group-text">
<i class="fa-regular fa-user"></i>
</span>

<input
type="text"
class="form-control"
id="loginIdentifier"
placeholder="Enter your email or username"
/>

</div>

<div class="invalid-feedback" id="loginIdentifierError"></div>

</div>


<!-- PASSWORD -->

<div class="mb-3">

<label class="form-label">Password</label>

<div class="input-group custom-input">

<span class="input-group-text">
<i class="fa-solid fa-lock"></i>
</span>

<input
type="password"
class="form-control"
id="loginPassword"
placeholder="Enter password"
/>

<button
class="input-group-text password-toggle"
type="button"
id="toggleLoginPassword"
>

<i class="fa-regular fa-eye"></i>

</button>

</div>

<div class="invalid-feedback" id="loginPasswordError"></div>

</div>


<!-- REMEMBER ME -->

<div class="form-check mb-2">

<input
class="form-check-input"
type="checkbox"
id="rememberMe"
/>

<label class="form-check-label" for="rememberMe">
Remember me
</label>

</div>


<!-- GENERAL ERROR -->

<div class="alert alert-danger d-none" id="loginGeneralError"></div>


<!-- BUTTON -->

<button class="btn btn-main w-100 mt-2">
Login
</button>


<p class="text-center mt-3 link">

Don't have an account?
<a href="../auth/register.html" class="">
Register
</a>

</p>

</form>
 

        </section>
      </div>
    </main>

    <footer></footer>

    <script src="../../shared/js/bootstrap/bootstrap.bundle.min.js"></script>
    <script type="module" src="./auth.js"></script>
  </body>
</html>
