<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../../shared/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../../shared/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="auth.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <nav></nav>
    <main class="row mt-5 container-fluid">
        <section class="col-md-6 col-12 d-none d-md-block">
            <div class="img-wrapper">
                <img src="../../assets/images/login-image.jpg" alt="">
            </div>
        </section>

        <section class="col-md-6 col-12 d-flex flex-column align-items-center justify-content-center">
            <form id="registerForm" class="d-flex flex-column gap-3">
                <h2>Create New Account</h2>
                <p>Buy & sale your exclusive product only on Furnixar</p>
                <div class="w-100 mt-5">
                    <input type="text" placeholder="Enter your username" name="username" id="regUsername" class="form-control">
                    <small class="text-danger d-none" id="regUsernameError"></small>
                </div>
                <div class="w-100">
                    <input type="email" placeholder="Enter your email address" name="email" id="regEmail" class="form-control">
                    <small class="text-danger d-none" id="regEmailError"></small>
                </div>
                <div class="w-100">
                    <input type="password" placeholder="Enter your password" name="password" id="regPassword" class="form-control">
                    <small class="text-danger d-none" id="regPasswordError"></small>
                </div>
                <div class="w-100">
                    <input type="password" placeholder="Confirm your password" name="confirmPassword" id="regConfirmPassword" class="form-control">
                    <small class="text-danger d-none" id="regConfirmPasswordError"></small>
                </div>
                <div class="alert alert-danger d-none" id="regGeneralError"></div>
                <div class="alert alert-success d-none" id="regSuccessMsg"></div>
                <input type="submit" name="register" id="register" value="Register" class="form-control btn btn-primary">
            </form>
            <p class="register-text">Already have an account? <a href="login.html" class="text-decoration-none">Login</a></p>
        </section>
    </main>
    <footer></footer>
    <script src="../../shared/js/bootstrap/bootstrap.bundle.min.js"></script>
    <script type="module" src="./auth.js"></script>
</body>
</html>
