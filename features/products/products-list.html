<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link 
  rel="stylesheet" 
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
/>
<link href="../../global.css" rel="stylesheet" />
<link rel="stylesheet" href="./products.css">
</head>
<body>
<nav></nav>
<section class="page-hero">
  <div class="container position-relative text-center">
    <h1 class="page-title mb-2">Shop</h1>

    <nav class="breadcrumb-wrap" aria-label="breadcrumb">
      <ol class="breadcrumb justify-content-center mb-0">
        <li class="breadcrumb-item"><a href="../home/home.html">Home</a></li>
        <li class="breadcrumb-item active" aria-current="page">Shop</li>
      </ol>
    </nav>
  </div>
</section>
<div class="container py-5">
  <div class="row g-4">

    <!-- FILTERS SIDE -->
    <aside class="col-lg-3">
      <div class="products-filters-box">
        <h5 class="filters-title">Filters</h5>

        <div class="mb-3">
          <label for="searchByName" class="form-label">Search by name</label>
          <input
            type="text"
            id="searchByName"
            class="form-control"
            placeholder="Search product name..."
          />
        </div>

        <div class="mb-3">
          <label for="filterCategory" class="form-label">Category</label>
          <select id="filterCategory" class="form-select">
            <option value="">All Categories</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="sortPrice" class="form-label">Sort by price</label>
          <select id="sortPrice" class="form-select">
            <option value="">Default</option>
            <option value="low-high">Low to High</option>
            <option value="high-low">High to Low</option>
          </select>
        </div>

        <button id="resetFiltersBtn" class="btn btn-outline-main w-100">
          Reset
        </button>
      </div>
    </aside>

    <!-- PRODUCTS SIDE -->
    <section class="col-lg-9">
      <div class="products-header mb-3">
        <p id="productsCount" class="mb-0 text-muted"></p>
      </div>

      <div id="productsContainer" class="row g-4"></div>

      <div class="pagination-wrapper mt-5">
        <ul id="pagination" class="custom-pagination"></ul>
      </div>
    </section>

  </div>
</div>
<footer></footer>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script type="module" src="./products.js"></script>

</body>
</html>
